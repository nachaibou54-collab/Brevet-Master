
<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }
        .animate-shine { position: relative; overflow: hidden; }
        .animate-shine::after {
            content: ''; position: absolute; top: -50%; left: -100%; width: 50%; height: 200%;
            background: rgba(255, 255, 255, 0.3); transform: rotate(30deg);
            animation: shine 3s infinite; pointer-events: none;
        }

        /* Styles spécifiques aux fiches */
        .prose blockquote p { margin-bottom: 0 !important; }
        .math-multiply { font-family: 'Inter', sans-serif !important; font-weight: 900; color: #4f46e5; margin: 0 0.15rem; }
        
        .streaming-indicator {
            display: inline-block;
            width: 8px;
            height: 20px;
            background: #4f46e5;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            header, footer, .reminder-section, .clarification-form { display: none !important; }
            .fiche-container { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .fiche-container table tr:last-child td { border-bottom: none !important; }
        }
    </style>
